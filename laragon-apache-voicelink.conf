# VoiceLink - Apache Reverse Proxy Configuration for HTTPS & WSS
# Simpan atau salin file ini ke: C:\laragon\etc\apache2\sites-enabled\00-voicelink-ssl.conf

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !ssl_module>
    LoadModule ssl_module modules/mod_ssl.so
</IfModule>

# Listen port 443 jika belum didefinisikan
<IfModule ssl_module>
    Listen 443
</IfModule>

<VirtualHost *:443>
    DocumentRoot "C:/laragon/www"
    ServerName localhost

    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/laragon.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/laragon.key"

    # Reverse Proxy WebSocket Upgrade
    ProxyRequests Off
    ProxyPreserveHost On

    # Meneruskan koneksi wss://<host>/voice-ws langsung ke server PHP WebSocket pada 127.0.0.1:8765
    ProxyPass /voice-ws ws://127.0.0.1:8765/
    ProxyPassReverse /voice-ws ws://127.0.0.1:8765/

    <Directory "C:/laragon/www">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLink — Full Duplex Voice Chat</title>
    <meta name="description" content="Aplikasi voice call full duplex real-time menggunakan WebSocket dan PHP">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen" class="screen active">
    <div class="login-card">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="24" fill="url(#grad1)"/>
                    <path d="M24 14a5 5 0 0 1 5 5v6a5 5 0 0 1-10 0v-6a5 5 0 0 1 5-5z" fill="white"/>
                    <path d="M16 25c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                    <line x1="24" y1="33" x2="24" y2="37" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                    <line x1="20" y1="37" x2="28" y2="37" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="grad1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6C63FF"/>
                            <stop offset="1" stop-color="#3ECFCF"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="logo-title">VoiceLink</h1>
            <p class="logo-sub">Full Duplex Voice Chat</p>
        </div>

        <div class="input-group">
            <label for="username-input">Nama Kamu</label>
            <input id="username-input" type="text" placeholder="Masukkan nama..." maxlength="30" autocomplete="off"/>
        </div>

        <button id="join-btn" class="btn-primary" onclick="joinApp()">
            <span>Masuk & Mulai</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </button>

        <div class="ws-status" id="ws-status">
            <span class="dot disconnected"></span>
            <span id="ws-status-text">Menghubungkan ke server...</span>
        </div>
    </div>

    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>
</div>

<!-- ── MAIN APP SCREEN ── -->
<div id="app-screen" class="screen">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-small">
                <svg viewBox="0 0 32 32" fill="none" width="32" height="32">
                    <circle cx="16" cy="16" r="16" fill="url(#grad2)"/>
                    <path d="M16 9a3.5 3.5 0 0 1 3.5 3.5v4a3.5 3.5 0 0 1-7 0v-4A3.5 3.5 0 0 1 16 9z" fill="white"/>
                    <path d="M11 17c0 2.76 2.24 5 5 5s5-2.24 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="16" y1="22" x2="16" y2="25" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="grad2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6C63FF"/>
                            <stop offset="1" stop-color="#3ECFCF"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span>VoiceLink</span>
            </div>
        </div>

        <div class="my-profile">
            <div class="avatar" id="my-avatar">A</div>
            <div>
                <div class="my-name" id="my-name-display">—</div>
                <div class="my-id" id="my-id-display">—</div>
            </div>
        </div>

        <div class="section-label">Online Sekarang</div>
        <div id="user-list" class="user-list">
            <div class="empty-list">Belum ada user lain online</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Idle State -->
        <div id="idle-panel" class="panel active">
            <div class="idle-illustration">
                <div class="pulse-ring ring1"></div>
                <div class="pulse-ring ring2"></div>
                <div class="pulse-ring ring3"></div>
                <div class="mic-icon">
                    <svg viewBox="0 0 64 64" fill="none">
                        <path d="M32 12a8 8 0 0 1 8 8v12a8 8 0 0 1-16 0V20a8 8 0 0 1 8-8z" fill="url(#gmic)"/>
                        <path d="M20 32c0 6.6 5.4 12 12 12s12-5.4 12-12" stroke="url(#gmic)" stroke-width="3" stroke-linecap="round"/>
                        <line x1="32" y1="44" x2="32" y2="51" stroke="url(#gmic)" stroke-width="3" stroke-linecap="round"/>
                        <line x1="26" y1="51" x2="38" y2="51" stroke="url(#gmic)" stroke-width="3" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="gmic" x1="20" y1="12" x2="44" y2="56" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#6C63FF"/>
                                <stop offset="1" stop-color="#3ECFCF"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <h2>Siap untuk Berbicara</h2>
            <p>Pilih seseorang dari daftar pengguna di sebelah kiri untuk memulai panggilan suara.</p>
        </div>

        <!-- Calling State (outgoing) -->
        <div id="calling-panel" class="panel">
            <div class="call-avatar-wrap">
                <div class="call-avatar" id="calling-avatar">?</div>
                <div class="call-rings">
                    <div class="call-ring cr1"></div>
                    <div class="call-ring cr2"></div>
                </div>
            </div>
            <div class="call-status-label">Memanggil...</div>
            <div class="call-peer-name" id="calling-name">—</div>
            <button class="btn-end-call" id="cancel-call-btn" onclick="cancelCall()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
                </svg>
                Batalkan
            </button>
        </div>

        <!-- Incoming Call State -->
        <div id="incoming-panel" class="panel">
            <div class="incoming-animation">
                <div class="incoming-ring ir1"></div>
                <div class="incoming-ring ir2"></div>
                <div class="incoming-ring ir3"></div>
                <div class="call-avatar incoming-avatar" id="incoming-avatar">?</div>
            </div>
            <div class="call-status-label incoming-label">Panggilan Masuk</div>
            <div class="call-peer-name" id="incoming-name">—</div>
            <div class="incoming-actions">
                <button class="btn-accept" id="accept-call-btn" onclick="acceptCall()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
                    </svg>
                    Terima
                </button>
                <button class="btn-reject" id="reject-call-btn" onclick="rejectCall()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" transform="rotate(135 12 12)"/>
                    </svg>
                    Tolak
                </button>
            </div>
        </div>

        <!-- Active Call State -->
        <div id="active-call-panel" class="panel">
            <div class="active-call-header">
                <div class="active-avatar" id="active-avatar">?</div>
                <div class="active-call-info">
                    <div class="active-peer-name" id="active-peer-name">—</div>
                    <div class="call-timer" id="call-timer">00:00</div>
                </div>
            </div>

            <div class="waveform-wrap">
                <div class="waveform" id="waveform-local">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="waveform-label">Kamu</div>
                <div class="waveform" id="waveform-remote">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="waveform-label" id="remote-wave-label">Lawan Bicara</div>
            </div>

            <div class="call-controls">
                <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()" title="Mute/Unmute">
                    <svg id="mic-icon-on" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4zm0 14a6 6 0 0 0 6-6H6a6 6 0 0 0 6 6zm-1 2v2H9v2h6v-2h-2v-2h-2z"/>
                    </svg>
                    <svg id="mic-icon-off" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <path d="M19 11a7 7 0 0 1-7 7m0 0a7 7 0 0 1-7-7m7 7v3m-3 0h6M12 1a4 4 0 0 1 4 4v4M8.21 8.21A4 4 0 0 0 8 10v2a4 4 0 0 0 6.58 3.08M3 3l18 18"/>
                    </svg>
                    <span>Mute</span>
                </button>

                <button class="ctrl-btn btn-hangup" id="hangup-btn" onclick="endCall()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" transform="rotate(135 12 12)"/>
                    </svg>
                    <span>Tutup</span>
                </button>

                <button class="ctrl-btn" id="vol-btn" onclick="toggleVolume()" title="Volume">
                    <svg id="vol-icon-on" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                    <svg id="vol-icon-off" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zm-2.5.63l-3-3-1-1L5.27 3 4 4.27 7.73 8H3v8h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.994 8.994 0 0 0 16.73 20l2 2L20 20.73 4.27 5"/>
                    </svg>
                    <span>Suara</span>
                </button>
            </div>
        </div>
    </main>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script src="app.js?v=2.2"></script>
</body>
</html>
